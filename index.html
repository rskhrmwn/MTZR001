<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Zadul Rahil - Kuis Kun Salafiyyan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--g1:#14492e;--g2:#1f7a47;--g3:#e3f1e6;--cream:#f2f0d4;--gold:#c9a24b;--ink:#10281a;--red:#c62f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b2416;overflow:hidden;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:var(--cream);overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{background:var(--g1);color:#fff;font-weight:800;font-size:34px;min-height:88px;padding:0 56px;border-radius:44px;border-bottom:7px solid #0a2a19;box-shadow:0 8px 20px #0004}
.btn:active{transform:translateY(4px);border-bottom-width:3px}
.btn.alt{background:#fff;color:var(--g1);border:4px solid var(--g1);border-bottom-width:7px}
.btn:disabled{opacity:.45}
/* start */
#start{background:#f3f2dc center/cover no-repeat;align-items:flex-end;justify-content:center;padding-bottom:34px;text-align:center}
#start .box{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px}
#start .info{font-size:26px;font-weight:700;color:var(--g1);background:#ffffffd9;padding:8px 26px;border-radius:30px}
/* game */
#game{flex-direction:column}
.hdr{height:78px;background:var(--g1);display:flex;align-items:center;gap:16px;padding:0 24px;color:#fff;flex:none}
.hdr img{width:58px;height:58px;border-radius:14px;background:var(--cream)}
.brand{font-family:Georgia,serif;font-size:30px;font-weight:700;letter-spacing:1px;flex:1}
.pill{background:#ffffff1f;border:2px solid #ffffff55;border-radius:18px;padding:7px 20px;font-size:28px;font-weight:800;white-space:nowrap}
.zb{width:60px;height:56px;border-radius:16px;background:#fff;color:var(--g1);font-size:26px;font-weight:900}
.zb:active{background:var(--gold)}
.prog{height:12px;background:#c9d9cd;flex:none}.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.main{flex:1;display:flex;gap:20px;padding:16px 24px 20px;min-height:0}
.left{width:496px;flex:none;background:#fff;border:3px solid var(--g2);border-radius:26px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;flex:none}
.tab{flex:1;height:58px;font-size:25px;font-weight:800;background:var(--g3);color:var(--g1)}
.tab.on{background:var(--g2);color:#fff}.tab:disabled{opacity:.5}
.pane{flex:1;min-height:0;overflow-y:auto;padding:18px 22px;font-size:var(--fs,26px);line-height:1.38;overscroll-behavior:contain}
.pane .tp{font-size:.8em;font-weight:800;color:var(--g2);margin-bottom:8px}
.pane .cs{margin:0 0 14px}
.pane .qq{font-weight:800;border-top:3px solid var(--gold);padding-top:12px}
.pane h3{margin:0 0 8px;font-size:1.25em}
.pane .ok{color:#14803f}.pane .no{color:var(--red)}
.pane .tr{margin:8px 0}.pane .tr b{display:inline-block;min-width:1.4em}
.pane .hs{background:var(--g3);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:.85em}
#nx{display:none;margin:0 14px 14px;min-height:76px;font-size:30px;flex:none}
.opts{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;font-size:var(--fs,24px);line-height:1.34;overscroll-behavior:contain;padding-right:4px}
.opt{flex:none;display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fff;border:3px solid #9cc4a8;border-bottom-width:7px;border-radius:20px;padding:12px 16px;min-height:70px;width:100%;color:var(--ink)}
.opt:active{transform:translateY(3px)}
.opt .lt{flex:none;width:2em;height:2em;border-radius:50%;background:var(--g2);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.9em}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere;word-break:normal}
.opt.right{background:#d8f3e0;border-color:#1b9a50}.opt.right .lt{background:#1b9a50}
.opt.wrong{background:#fde2e2;border-color:var(--red)}.opt.wrong .lt{background:var(--red)}
.opt.dim{opacity:.6}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--g2);border-radius:6px}::-webkit-scrollbar-track{background:#e6efe8;border-radius:6px}
/* end */
#end{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#fff,var(--cream) 60%,#cfe3d3)}
#end img{width:130px;height:130px;border-radius:30px;box-shadow:0 6px 18px #0003}
#end h2{font-family:Georgia,serif;font-size:62px;margin:10px 0 0;color:var(--g1)}
#stars{font-size:90px;color:var(--gold);letter-spacing:8px;line-height:1.1}
#es{font-size:34px;font-weight:700;margin:6px 0 24px;line-height:1.5}
.row{display:flex;gap:22px}
#rot{position:fixed;inset:0;background:var(--g1);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:800;z-index:9;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <section class="screen on" id="start">
    <div class="box">
      <button class="btn" id="go">MULAI KUIS</button>
      <div class="info">30 soal studi kasus. Putar HP ke posisi mendatar.</div>
    </div>
  </section>
  <section class="screen" id="game">
    <div class="hdr">
      <img id="emb" alt="Logo Zadul Rahil"><div class="brand">ZADUL RAHIL</div>
      <div class="pill" id="no"></div><div class="pill" id="sc"></div>
      <button class="zb" id="zm" aria-label="Kecilkan huruf">A-</button><button class="zb" id="zp" aria-label="Besarkan huruf">A+</button>
    </div>
    <div class="prog"><i id="pg"></i></div>
    <div class="main">
      <div class="left">
        <div class="tabs"><button class="tab on" id="t1">Kasus</button><button class="tab" id="t2" disabled>Pembahasan</button></div>
        <div class="pane" id="pane"></div>
        <button class="btn" id="nx">LANJUT</button>
      </div>
      <div class="opts" id="opts"></div>
    </div>
  </section>
  <section class="screen" id="end">
    <img id="emb2" alt="Logo Zadul Rahil">
    <h2 id="eh"></h2><div id="stars"></div><div id="es"></div>
    <div class="row"><button class="btn" id="again">MAIN LAGI</button><button class="btn alt" id="redo">ULANGI YANG SALAH</button></div>
  </section>
</div>
<div id="rot">Putar HP kamu ke posisi mendatar (landscape) agar soal terbaca dengan nyaman.</div>
<script>
var D=[{"n": 1, "t": "", "c": "Rizki, mahasiswa semester 6, sedang menyusun skripsi tentang akidah. Dosen pembimbingnya berkata: 'Sunnah itu kan cuma perkara yang tidak wajib, seperti shalat rawatib. Jadi kalau membahas akidah jangan pakai istilah Sunnah.'", "q": "Analisis paling tepat terhadap kekeliruan dosen tersebut berdasarkan pembahasan makna Sunnah dalam buku ini adalah...", "o": {"A": "Dosen tersebut benar, karena definisi Sunnah menurut Ahli Fiqih memang perkara yang tidak wajib, sehingga tidak relevan dipakai dalam bab akidah.", "B": "Dosen tersebut keliru karena menyamakan definisi Sunnah menurut Ahli Ushul dengan definisi Sunnah menurut Ahli Hadits.", "C": "Dosen tersebut keliru karena membatasi makna Sunnah hanya pada definisi fuqaha, padahal menurut mayoritas salaf, Sunnah secara mutlak dalam bab akidah maksudnya adalah agama secara keseluruhan, mencakup akidah, ibadah, ucapan dan perbuatan yang sesuai Qur'an dan Sunnah dan lawan dari bid'ah.", "D": "Dosen tersebut keliru karena Sunnah secara bahasa hanya bermakna jalan yang baik saja.", "E": "Dosen tersebut benar karena istilah Sunnah dalam buku-buku akidah seperti As-Sunnah karya Imam Ahmad maksudnya adalah kumpulan hadits dhaif."}, "k": "C", "h": "C5 Mengevaluasi – Membedakan definisi Sunnah menurut bahasa, ahli hadits, ushul, fiqih, dan salaf.", "tr": {"A": "Definisi fiqih memang ada tapi bukan makna mutlak.", "B": "Mengecoh definisi ushul dan hadits.", "D": "Salah, sunnah bahasa mencakup baik dan buruk (hadits Muslim).", "E": "Terbalik, kitab As-Sunnah adalah kitab akidah salaf."}}, {"n": 2, "t": "", "c": "Di grup kajian, Farid menolak disebut Salafi: 'Salafi itu hizbiyyah baru seperti Wahhabi buatan Muhammad bin Abdul Wahhab. Kita cukup sebut Muslim saja. Menisbatkan diri kepada selain Rasul itu bid'ah.'", "q": "Argumentasi paling kuat untuk membantah Farid adalah...", "o": {"A": "Penamaan Salafi memang bid'ah karena tidak ada di zaman Nabi, namun dibolehkan karena darurat.", "B": "Penamaan Salafi hakikatnya sama dengan penamaan Sunni, yaitu nisbat kepada Salafus Shalih yang terjaga akidah dan manhajnya. Ia bukan hizbiyyah karena tolok ukurnya bukan tokoh, melainkan Qur'an dan Sunnah dengan pemahaman sahabat, dan Muhammad bin Abdul Wahhab hanyalah salah satu pembaharu, bukan pendiri.", "C": "Penamaan Salafi wajib karena Kerajaan Saudi adalah negara salafiyyah.", "D": "Penamaan Salafi boleh karena Syaikhul Islam berkata salaf adalah semua orang yang hidup sebelum abad ke-5 Hijriyah tanpa melihat akidah.", "E": "Penamaan Salafi adalah tazkiyah yang wajib ditinggalkan."}, "k": "B", "h": "C4 Menganalisis perbedaan nisbat syar'i vs hizbiyyah.", "tr": {"A": "Buku tegas bukan bid'ah.", "C": "Ghuluw negara.", "D": "Buku justru MENOLAK definisi salaf hanya berdasarkan waktu.", "E": "Ahlul Hadits dan Salafi sinonim."}}, {"n": 3, "t": "", "c": "Panitia masjid ingin membubarkan paksa kajian yang terindikasi bid'ah malam ini juga. Ketua DKM melarang, karena jika dibubarkan paksa akan terjadi bentrok besar, masjid disegel polisi, dan kajian sunnah rutin 5 tahun terancam berhenti.", "q": "Keputusan Ketua DKM paling tepat jika ditinjau dari kaidah fiqih dalam buku ini...", "o": {"A": "Salah, karena amar ma'ruf nahi munkar fardhu 'ain harus segera tanpa mempertimbangkan akibat.", "B": "Benar, sebagai penerapan kaidah Dar'ul Mafasid Muqaddamun 'ala Jalbil Mashalih, sebagaimana Nabi menahan diri tidak membunuh munafikin dan tidak merobohkan Ka'bah di atas pondasi Ibrahim karena khawatir manusia lari dari Islam.", "C": "Benar, karena kaidah mengajarkan jika maslahat dan mafsadat bertabrakan, harus selalu memilih maslahat.", "D": "Salah, karena kaidah tersebut hanya berlaku untuk masalah furu' fiqih.", "E": "Benar, karena manhaj salaf dalam amar ma'ruf adalah diam."}, "k": "B", "h": "C5 Mengevaluasi penerapan kaidah menimbang maslahat mafsadat.", "tr": {"A": "Semangat tanpa ilmu.", "C": "Kaidah dibalik.", "D": "Salah, kaidah dipakai untuk masalah besar.", "E": "Murji'ah diam."}}, {"n": 4, "t": "", "c": "Dosen filsafat berkata: 'Metode salaf itu memang lebih selamat karena tidak banyak berdebat, tapi metode khalaf itu lebih berilmu dan lebih bijaksana karena sudah pakai logika dan ilmu kalam mendalam.'", "q": "Kritik terhadap pernyataan dosen tersebut berdasarkan buku ini...", "o": {"A": "Benar, karena itulah konsensus ulama bahwa jalan salaf aslam dan jalan khalaf a'lam dan ahkam.", "B": "Salah total, karena Ibnu Taimiyah membantah kedustaan tersebut: jalan salaf lebih selamat, LEBIH BERILMU, dan LEBIH BIJAKSANA, karena mereka paling tahu keadaan Nabi, paling cinta sunnah, dan paling kokoh.", "C": "Benar, karena keistimewaan manhaj salaf hanya pada wasathiyah saja.", "D": "Salah, karena yang lebih berilmu justru Ahli Bid'ah.", "E": "Benar sebagian, karena salaf memang lebih selamat tapi tidak sepakat dalam akidah karena berbeda waktu dan tempat."}, "k": "B", "h": "C4 Menganalisis syubhat klasik jalan khalaf.", "tr": {"A": "Syubhat paling terkenal yang dibantah.", "C": "Pengurangan keistimewaan.", "D": "Kebalikan total.", "E": "Terbalik, salaf sepakat akidah meski beda waktu."}}, {"n": 5, "t": "", "c": "Ustadz Ahmad berkata: 'Jangan pernah membicarakan keburukan ahli bid'ah di depan umum, itu ghibah haram mutlak. Kita cukup puasa, shalat, i'tikaf saja.'", "q": "Bantahan berdasarkan bab Sikap Salaf Terhadap Ahli Bid'ah...", "o": {"A": "Prinsipnya benar, karena ghibah ahli bid'ah haram mutlak.", "B": "Prinsipnya keliru, karena menerangkan keadaan ahli bid'ah dan memperingatkan umat darinya adalah wajib kifayah dan termasuk jihad fii sabilillah yang manfaatnya untuk seluruh kaum muslimin, bahkan Imam Ahmad mengatakan itu lebih utama daripada puasa, shalat, dan i'tikaf sunnah. Ghibah terhadap mereka dibolehkan dengan syarat untuk nasihat, bukan hasad pribadi.", "C": "Prinsipnya keliru, karena yang wajib adalah membunuh ahli bid'ah langsung.", "D": "Prinsipnya benar, karena amar ma'ruf nahi munkar fardhu kifayah, jika sudah ada yang puasa maka gugur.", "E": "Prinsipnya keliru, karena yang boleh di-ghibahi hanya pelaku maksiat saja."}, "k": "B", "h": "C6 Mencipta argumen bantahan dengan syarat tahdzir.", "tr": {"A": "Ghibah ahli bid'ah yang menyeru boleh.", "C": "Ghuluw takfiri.", "D": "Salah paham kifayah.", "E": "Terbalik."}}, {"n": 6, "t": "Ahlul Hadits bukan sekedar pencatat", "c": "Seseorang meremehkan Ahlul Hadits sebagai tukang catat hadits saja tanpa pemahaman.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Ahlul Hadits bukan sekedar pencatat' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ibnu Taimiyah menjelaskan yang dimaksud Ahlul Hadits bukan hanya yang mendengar, mencatat, meriwayatkan, tapi yang berhak menjaganya, memahaminya lahir batin dan mengikutinya. Maka Ahlul Hadits = Ahlussunnah. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Ahlul Hadits bukan sekedar pencatat", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 7, "t": "Atsariyyah", "c": "Seorang liberal berkata Atsariyyah itu aliran tekstual kaku yang anti akal.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Atsariyyah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Atsariyyah adalah orang yang mengambil akidah dari Kitabullah, sunnah shahih, dan yang shahih dari salafush shalih sahabat dan tabiin. Tanda ahli bid'ah adalah mencela ahli atsar. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Atsariyyah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 8, "t": "Al Firqatun Najiyah dan Thaifah Manshurah", "c": "Seseorang membedakan Firqah Najiyah dan Thaifah Manshurah sebagai dua kelompok berbeda di zaman ini.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Al Firqatun Najiyah dan Thaifah Manshurah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Keliru, keduanya sama. Mereka yang di atas jalanku dan sahabatku. Akan senantiasa ada sekelompok yang ditolong di atas kebenaran sampai hari kiamat. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Al Firqatun Najiyah dan Thaifah Manshurah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 9, "t": "Wasathiyah Ahlussunnah", "c": "Seorang mengatakan Ahlussunnah itu ekstrim dalam menetapkan sifat Allah karena menetapkan secara lahiriah.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Wasathiyah Ahlussunnah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ahlussunnah wasath: antara Mu'aththilah Jahmiyyah (meniadakan sifat) dan Mumatsilah Musyabbihah (menyerupakan), antara Qadariyyah dan Jabriyyah, antara Murji'ah dan Wa'idiyyah, antara Rafidhah dan Khawarij dalam sahabat. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Wasathiyah Ahlussunnah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 10, "t": "Manhaj talaqqi salaf", "c": "Dalam diskusi akidah, seseorang berkata: Cukup berdalil dengan Al-Qur'an saja, hadits ahad tidak bisa dipakai dalam akidah.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Manhaj talaqqi salaf' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Manhaj salaf dalam akidah: berhujjah dengan Sunnah yang shahih baik mutawatir maupun ahad, menerima semua yang disebutkan wahyu dan tidak membantahnya dengan akal. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Manhaj talaqqi salaf", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 11, "t": "Tanda menyimpang: mutasyabihat", "c": "Seorang selalu mencari ayat mutasyabihat untuk membenarkan bid'ahnya dan menimbulkan fitnah.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Tanda menyimpang: mutasyabihat' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ciri utama menyimpang: mengikuti ayat mutasyabihat untuk menimbulkan fitnah mencari takwilnya (Ali Imran 7), berpecah belah, memperturut hawa nafsu, mempertentangkan Sunnah dengan Qur'an, membenci Ahlul Atsar. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Tanda menyimpang: mutasyabihat", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 12, "t": "Tanda menyimpang: gelar buruk", "c": "Seorang menamai Ahlussunnah sebagai Hasyawiyyah, Mujassimah, dan Nawashib.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Tanda menyimpang: gelar buruk' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ini tanda Ahli Bid'ah: tanda zindiq menamai Ahlussunnah Hasyawiyyah, tanda Qadariyyah menamai Ahlul Atsar Jabriyyah, tanda Murji'ah menamai mukhalafah nuqshaniyyah, tanda Rafidhah menamai Nawashib. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Tanda menyimpang: gelar buruk", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 13, "t": "Kaidah ibadah tawqif", "c": "Seorang membuat dzikir berjamaah dengan hitungan khusus yang tidak ada contoh dari Nabi dengan dalih cinta Nabi.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Kaidah ibadah tawqif' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ibadah pondasinya tawqif menunggu dalil. Umar mencium hajar aswad: aku tahu engkau batu tidak memberi manfaat, kalau bukan karena melihat Rasul menciummu aku tidak menciummu. Ikutilah jangan mengada-ada. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Kaidah ibadah tawqif", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 14, "t": "Kaidah ilmu bermanfaat dan amal shalih", "c": "Seorang sibuk debat kalam tanpa amal, merasa sudah di atas kebenaran karena pintar berdebat.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Kaidah ilmu bermanfaat dan amal shalih' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Poros agama: ilmu bermanfaat (petunjuk) dan amal shalih (agama yang hak). Ahlussunnah tidak berbicara kecuali mengikuti yang dibawa Rasul. Ahli bid'ah bersandar akal, bahasa, filsafat. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Kaidah ilmu bermanfaat dan amal shalih", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 15, "t": "Kaidah syarat dan penghalang takfir", "c": "Seorang mudah mengkafirkan pelaku bid'ah tanpa perincian dan tanpa melihat udzur.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Kaidah syarat dan penghalang takfir' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Hukum ushul dan furu tidak sempurna kecuali terpenuhi syarat dan hilangnya penghalang. Takfir butuh dua pokok: ada dalil Qur'an Sunnah bahwa ucapan/perbuatan itu mengkafirkan, dan berlaku pada orang tertentu telah terpenuhi syarat dan hilang penghalang. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Kaidah syarat dan penghalang takfir", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 16, "t": "Amar ma'ruf butuh ilmu lembut sabar", "c": "Seorang amar ma'ruf dengan kasar dan tanpa ilmu sehingga orang lari dari dakwah.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Amar ma'ruf butuh ilmu lembut sabar' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ibnu Taimiyah: yang beramar ma'ruf harus tahu apa yang diperintahkan, lembut, santun, sabar. Seperti dokter lembut, pendidik lembut. Firman: berbicaralah dengan kata lemah lembut kepada Fir'aun. Luqman 17 sabar. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Amar ma'ruf butuh ilmu lembut sabar", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 17, "t": "Sikap salaf terhadap duduk dengan ahli bid'ah", "c": "Seorang hobi duduk dan debat dengan ahli bid'ah dengan alasan dakwah dan ingin terlihat toleran.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Sikap salaf terhadap duduk dengan ahli bid'ah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Salaf melarang: Jangan duduk dengan pengikut hawa nafsu, jangan debat mereka. Hasan Al-Bashri: menyingkirlah, aku sudah tahu agamaku. Muhammad bin Sirin menolak dibacakan ayat oleh ahli bid'ah karena khawatir ditakwil lalu menancap di hati. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Sikap salaf terhadap duduk dengan ahli bid'ah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 18, "t": "Bid'ah lebih disukai Iblis", "c": "Seorang meremehkan bid'ah kecil dengan berkata: yang penting tidak maksiat besar.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Bid'ah lebih disukai Iblis' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Sufyan Tsauri: bid'ah lebih disukai Iblis daripada maksiat, karena maksiat pelakunya diterima taubatnya, bid'ah tidak. Allah menghalangi taubat pelaku bid'ah sampai meninggalkan bid'ahnya. Yahya bin Ya'mar: bid'ah akan menganggap halal pedang. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Bid'ah lebih disukai Iblis", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 19, "t": "Wajib kembali kepada Qur'an Sunnah", "c": "Dua kelompok berselisih tentang akidah dan masing-masing bertahan dengan pendapat kelompoknya dan tidak mau kembali ke dalil.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Wajib kembali kepada Qur'an Sunnah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Allah perintahkan: jika berselisih kembalikan kepada Allah dan Rasul (An-Nisa 59). Nakirah 'syai' mencakup semua perselisihan ushul dan furu. Ibnul Qayyim: kalau di Kitabullah dan Sunnah tidak ada penyelesaian, mustahil Allah perintahkan kembali. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Wajib kembali kepada Qur'an Sunnah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 20, "t": "Makna Jamaah", "c": "Seseorang berkata Al-Jamaah adalah mayoritas orang saja, meskipun di atas bid'ah.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Makna Jamaah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Al-Jamaah bukan sekedar mayoritas. Sunnah digandengkan dengan Jamaah sebagaimana bid'ah digandengkan dengan furqah. Jamaah adalah yang berkumpul di atas kebenaran, berpegang Kitabullah Sunnah dan disepakati generasi pertama Muhajirin Anshar. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Makna Jamaah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 21, "t": "Islam agama sempurna", "c": "Seseorang berkata Islam belum sempurna, butuh tambahan adat dan filsafat modern agar relevan.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Islam agama sempurna' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Allah: Pada hari ini Kusempurnakan untukmu agamamu (Al-Maidah 3). Ibnul Qayyim: jalan yang menyampaikan kepada Allah hanya satu, yaitu ajaran yang dibawa Rasul dan kitab-Nya. Semua jalan lain tertutup. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Islam agama sempurna", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 22, "t": "Permusuhan terhadap salafiyyah", "c": "Seorang berkata permusuhan barat terhadap dakwah salafiyyah adalah karena salafiyyah keras dan mudah mengkafirkan.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Permusuhan terhadap salafiyyah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Buku menjelaskan: permusuhan Yahudi Nasrani terhadap Islam tidak aneh (Al-Baqarah 120). Tuduhan terhadap salafiyyah bahwa mudah mengkafirkan, ekstrim adalah dusta dan pemutarbalikan fakta oleh politikus barat dan yang terpengaruh zionis. Dakwah salaf jauh dari ghuluw. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Permusuhan terhadap salafiyyah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 23, "t": "Istilah Salafiyyin dari nash syar'i", "c": "Seseorang berkata istilah Salafi tidak ada dalilnya, buat-buat saja oleh Wahhabi.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Istilah Salafiyyin dari nash syar'i' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Istilah salafiyyin diambil dari nash syar'i. Sam'ani dalam Al-Ansab: Salafi nisbat kepada salaf dan mengikuti madzhab mereka. Dzahabi berkata: seorang hafizh harus salafi. Tidak ada aib menampakkan madzhab salaf, bahkan wajib diterima (Ibnu Taimiyah 4/149). Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Istilah Salafiyyin dari nash syar'i", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 24, "t": "Hukum loyalitas kepada ahli bid'ah", "c": "Seorang berteman dekat dan loyal kepada ahli bid'ah yang jelas menyeru kepada bid'ahnya dan membela mereka.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Hukum loyalitas kepada ahli bid'ah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Salaf memperingatkan hukuman bagi yang loyal kepada ahli bid'ah. Cinta karena Allah, benci karena Allah, memberi karena Allah. Berwala kepada ahli bid'ah yang menyelisihi Qur'an Sunnah adalah menyelisihi pokok wala bara. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Hukum loyalitas kepada ahli bid'ah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 25, "t": "Jalan orang mukmin adalah sahabat", "c": "Seorang berkata cukup ikut Qur'an Sunnah saja, tidak perlu ikut jalan sahabat karena sahabat juga manusia biasa.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Jalan orang mukmin adalah sahabat' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Allah ancam: barang siapa menentang Rasul setelah jelas kebenaran dan mengikuti jalan bukan jalan orang mukmin, Kami biarkan sesat dan masukkan Jahannam (An-Nisa 115). Ibnul Qayyim: semua sahabat kembali kepada Allah, wajib diikuti jalannya, ucapannya, akidahnya. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Jalan orang mukmin adalah sahabat", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 26, "t": "Definisi salaf bukan periode", "c": "Seorang berkata salaf adalah periode zaman saja, bukan manhaj, jadi pemikiran Islam berkembang tergantung pembawanya.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Definisi salaf bukan periode' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Definisi ini ditolak di buku. Salaf bukan sekedar periode sebelum abad ke-5 H. Harus ditambahkan kesesuaian dengan Qur'an Sunnah. Barang siapa pendapatnya menyelisihi Qur'an Sunnah maka bukan salafi meskipun tinggal di tengah sahabat. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Definisi salaf bukan periode", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 27, "t": "Kedudukan sahabat", "c": "Seorang meremehkan sahabat dan berkata kita lebih pintar karena punya teknologi.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Kedudukan sahabat' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Sahabat sebaik-baik generasi (hadits Bukhari), paling baik hatinya, paling dalam ilmunya, paling sedikit bebannya. Mereka dipilih Allah menemani Nabi. Allah ridha kepada Muhajirin Anshar dan yang mengikuti mereka dengan baik (At-Taubah 100) dan sediakan surga. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Kedudukan sahabat", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 28, "t": "Ciri dakwah salafiyyah adil dan tengah", "c": "Seorang menuduh dakwah salaf itu kaku dan tidak toleran terhadap madzhab fiqih.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Ciri dakwah salafiyyah adil dan tengah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ciri Islam adil dan tengah, tidak ghuluw dan tidak keras. Ciri Saudi: bijaksana, toleran terhadap madzhab fiqih terpandang, penuntut ilmu mempelajari 4 madzhab karena khilaf furu bukan akidah. Raja Abdul Aziz: Abu Hanifah, Malik, Syafi'i, Ahmad adalah imam-imam kami. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Ciri dakwah salafiyyah adil dan tengah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 29, "t": "Penyebab bid'ah adalah takwil rusak", "c": "Seorang menakwil ayat sifat Allah secara batil dengan akalnya untuk menolak sifat.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Penyebab bid'ah adalah takwil rusak' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Ibnul Qayyim: terpecahnya umat menjadi 73 golongan karena salah takwil. Ibnu Abi Izz: tidaklah Khawarij memberontak, Mu'tazilah mengasingkan diri, Syiah menolak khilafah, kecuali karena takwil rusak. Manhaj ahli hawa: bersandar akal, hadits dhaif, mengikuti mutasyabihat. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Penyebab bid'ah adalah takwil rusak", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}, {"n": 30, "t": "Hadits iftiraqul ummah", "c": "Seorang berkata semua 73 golongan masuk surga karena masih Islam.", "q": "Berdasarkan buku Kun Salafiyyan, analisis paling tepat terhadap kasus 'Hadits iftiraqul ummah' adalah...", "o": {"A": "Pernyataan tersebut benar secara mutlak tanpa perincian, sebagaimana pendapat awam yang tidak mendalami dalil.", "B": "Pernyataan tersebut keliru total karena bertentangan dengan nash, padahal dalilnya jelas namun ia menolak karena hawa nafsu.", "C": "Nabi: Umatku akan terpecah 73 golongan, semua di neraka kecuali satu yaitu Al-Jamaah. Dalam riwayat lain: yaitu yang aku dan para sahabatku berada di atasnya. Maka yang selamat adalah yang di atas keadaan Nabi dan sahabatnya. Inilah jawaban yang paling tepat dan komprehensif sesuai manhaj salaf.", "D": "Pernyataan tersebut benar karena sesuai akal dan perasaan, meskipun menyelisihi dalil dan pemahaman salaf.", "E": "Pernyataan tersebut makruh saja, tidak perlu dibantah secara ilmiah dan cukup didiamkan."}, "k": "C", "h": "C4-C6 HOTS – Evaluasi kasus Hadits iftiraqul ummah", "tr": {"A": "Generalisasi tanpa ilmu.", "B": "Mirip benar tapi tidak lengkap, sengaja menjebak yang setengah paham.", "D": "Mendahulukan akal atas dalil - manhaj ahli bid'ah.", "E": "Meremehkan bahaya bid'ah."}}],BG="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCALQBQADASIAAhEBAxEB/8QAHAABAQACAwEBAAAAAAAAAAAAAAECAwQFBgcI/8QAVhAAAQMCBAMFBAcCCgcGBQMFAQACAwQRBRIhMQZBUQc var st=$("stage"),Z=1,Qs,i,score,streak,best,right,wrong,cur,done,order,pick,tab=1,LET="ABCDE";

addEventListener("resize",fitStage);fitStage();
function show(x){document.querySelectorAll(".screen").forEach(function(e){e.classList.remove("on")});$(x).classList.add("on")}
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}

function begin(list){Qs=list;i=0;score=0;streak=0;best=0;right=0;wrong=[];show("game");load()}

  $("eh").textContent=pc>=.9?"Luar biasa!":pc>=.7?"Sangat baik!":pc>=.4?"Cukup baik":"Ayo belajar lagi";
  $("es").innerHTML="";
  ["Benar "+right+" dari "+Qs.length+" soal","Skor "+score+" | Beruntun terbaik "+best].forEach(function(t){$("es").appendChild(el("div","",t))});
  $("redo").style.display=wrong.length?"":"none";
}
</script>
</body>
</html>
